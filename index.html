<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificador · Gestión de clases</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ========== RESET & BASE ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }

    .app-container {
      max-width: 1400px;
      width: 100%;
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 20px 60px -15px rgba(37, 76, 156, 0.15);
      padding: 2.5rem;
      transition: all 0.2s ease;
    }

    /* ========== HEADER ========== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
      border-bottom: 2px solid #e8eef5;
      padding-bottom: 1.8rem;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    /* Image container */
    .header-image {
      width: 300px;
      height: 164px;
      border-radius: 20px;
      overflow: hidden;
      background: linear-gradient(135deg, #00ADDA, #254C9C);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px -6px rgba(0, 173, 218, 0.4);
      flex-shrink: 0;
    }

    .header-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .header-image i {
      font-size: 2rem;
      color: white;
    }

    .header h1 {
      font-size: 1.9rem;
      font-weight: 700;
      background: linear-gradient(135deg, #254C9C 0%, #00ADDA 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
      line-height: 1.3;
    }

    .header h1 span {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: #64748b;
      -webkit-text-fill-color: #64748b;
      background: none;
      margin-top: 4px;
      letter-spacing: 0;
    }

    .header-badge {
      background: #e6f7fc;
      padding: 0.6rem 1.4rem;
      border-radius: 60px;
      color: #254C9C;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(0, 173, 218, 0.2);
      box-shadow: 0 2px 8px rgba(0, 173, 218, 0.08);
    }

    .header-badge i {
      color: #00ADDA;
    }

    /* ========== YEAR TABS ========== */
    .year-tabs {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 2.2rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid #e8eef5;
    }

    .year-btn {
      background: transparent;
      border: 2px solid #e8eef5;
      padding: 0.7rem 1.8rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 60px;
      color: #64748b;
      transition: all 0.25s ease;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .year-btn i {
      font-size: 0.85rem;
      color: #94a3b8;
      transition: color 0.25s;
    }

    .year-btn:hover {
      background: #f1f7fb;
      border-color: #00ADDA;
      color: #254C9C;
    }

    .year-btn:hover i {
      color: #00ADDA;
    }

    .year-btn.active {
      background: linear-gradient(135deg, #254C9C, #00ADDA);
      border-color: transparent;
      color: white;
      box-shadow: 0 6px 18px -6px rgba(37, 76, 156, 0.5);
    }

    .year-btn.active i {
      color: white;
    }

    /* ========== SUBJECTS GRID ========== */
    .subjects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.8rem;
      margin-bottom: 2.5rem;
    }

    .subject-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 1.8rem;
      transition: all 0.25s ease;
      border: 2px solid #e8eef5;
      box-shadow: 0 4px 12px -4px rgba(37, 76, 156, 0.06);
      position: relative;
      overflow: hidden;
    }

    .subject-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #00ADDA, #96C11F);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .subject-card:hover {
      border-color: #00ADDA;
      box-shadow: 0 12px 28px -10px rgba(37, 76, 156, 0.15);
      transform: translateY(-3px);
    }

    .subject-card:hover::before {
      opacity: 1;
    }

    .subject-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 1.4rem;
      border-bottom: 2px dashed #e8eef5;
      padding-bottom: 1rem;
    }

    .subject-header .icon-wrapper {
      font-size: 1.6rem;
      width: 3rem;
      height: 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e6f7fc, #f0f7e6);
      border-radius: 16px;
      color: #254C9C;
      flex-shrink: 0;
    }

    .subject-header h2 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #254C9C;
      letter-spacing: -0.3px;
    }

    /* ========== MODULE GRID ========== */
    .module-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.7rem;
    }

    .module-btn {
      background: #f8fafc;
      border: 2px solid #e8eef5;
      border-radius: 14px;
      padding: 0.7rem 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .module-btn i {
      font-size: 0.75rem;
      color: #94a3b8;
      transition: color 0.2s;
    }

    .module-btn:hover {
      background: #e6f7fc;
      border-color: #00ADDA;
      color: #254C9C;
      transform: translateY(-2px);
    }

    .module-btn:hover i {
      color: #00ADDA;
    }

    .module-btn.active-module {
      background: linear-gradient(135deg, #254C9C, #00ADDA);
      border-color: transparent;
      color: white;
      box-shadow: 0 6px 14px -6px rgba(37, 76, 156, 0.5);
    }

    .module-btn.active-module i {
      color: white;
    }

    /* ========== WEEKS PANEL ========== */
    .weeks-panel {
      background: linear-gradient(135deg, #f8fbfd, #f4f8fb);
      border-radius: 28px;
      padding: 2rem;
      border: 2px solid #e8eef5;
      transition: all 0.2s;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.8rem;
    }

    .panel-header h3 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #254C9C;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .panel-header h3 i {
      color: #00ADDA;
      font-size: 1.1rem;
    }

    .week-indicator {
      background: white;
      padding: 0.5rem 1.3rem;
      border-radius: 60px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #254C9C;
      border: 2px solid #00ADDA;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(0, 173, 218, 0.1);
    }

    .week-indicator i {
      color: #00ADDA;
    }

    /* ========== WEEKS GRID ========== */
    .weeks-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      align-items: center;
    }

    .week-item {
      background: white;
      border-radius: 50px;
      padding: 0.5rem 1.2rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
      border: 2px solid #e8eef5;
      transition: all 0.2s ease;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .week-item i {
      font-size: 0.7rem;
      color: #94a3b8;
      transition: color 0.2s;
    }

    .week-item:hover {
      background: #e6f7fc;
      border-color: #00ADDA;
      color: #254C9C;
      transform: translateY(-2px);
    }

    .week-item:hover i {
      color: #00ADDA;
    }

    .week-item.active-week {
      background: linear-gradient(135deg, #254C9C, #00ADDA);
      border-color: transparent;
      color: white;
      box-shadow: 0 6px 14px -6px rgba(37, 76, 156, 0.5);
    }

    .week-item.active-week i {
      color: white;
    }

    /* ========== FILES SECTION ========== */
    .files-section {
      margin-top: 1.8rem;
      background: white;
      border-radius: 20px;
      padding: 1.5rem;
      border: 2px solid #e8eef5;
    }

    .files-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #254C9C;
      letter-spacing: 0.3px;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 2px dashed #e8eef5;
      padding-bottom: 0.8rem;
    }

    .files-title i {
      color: #00ADDA;
    }

    .files-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .file-link {
      background: #f8fafc;
      border: 2px solid #e8eef5;
      border-radius: 50px;
      padding: 0.5rem 1.2rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: #254C9C;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      text-decoration: none;
      cursor: pointer;
    }

    .file-link i {
      color: #96C11F;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .file-link:hover {
      background: #e6f7fc;
      border-color: #00ADDA;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px -6px rgba(0, 173, 218, 0.3);
    }

    .file-link:hover i {
      color: #00ADDA;
    }

    .file-empty {
      color: #94a3b8;
      font-size: 0.9rem;
      font-weight: 400;
      padding: 0.5rem 0;
    }

    /* ========== FOOTER ========== */
    .footer-note {
      margin-top: 2.5rem;
      text-align: center;
      color: #64748b;
      font-size: 0.85rem;
      border-top: 2px solid #e8eef5;
      padding-top: 1.8rem;
      letter-spacing: 0.3px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .footer-note i {
      color: #96C11F;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 768px) {
      .app-container { padding: 1.8rem; }
      .header h1 { font-size: 1.5rem; }
      .subjects-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 600px) {
      body { padding: 1rem 0.5rem; }
      .app-container { padding: 1.3rem; border-radius: 24px; }
      .header { flex-direction: column; align-items: flex-start; }
      .header-left { gap: 1rem; }
      .header-image { width: 55px; height: 55px; border-radius: 14px; }
      .header h1 { font-size: 1.3rem; }
      .year-tabs { gap: 0.4rem; }
      .year-btn { padding: 0.6rem 1rem; font-size: 0.8rem; }
      .module-grid { grid-template-columns: 1fr 1fr; }
      .weeks-panel { padding: 1.3rem; }
      .panel-header h3 { font-size: 1.1rem; }
    }

    @media (max-width: 400px) {
      .module-grid { grid-template-columns: 1fr; }
      .subject-card { padding: 1.2rem; }
      .files-grid { flex-direction: column; }
      .file-link { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
<div class="app-container">

  <!-- HEADER with Image -->
  <div class="header">
    <div class="header-left">
      
      <div class="header-image">
        
        <img src="logo.png" alt="Logo">
        
      </div>
      <h1>
        ¡Supérate! Mobiliare
        <span>Planificación de clases</span>
      </h1>
    </div>
    <div class="header-badge">
      <i class="fas fa-folder-open"></i> 2 materias · 3 años
    </div>
  </div>

  <!-- Year Tabs -->
  <div class="year-tabs" id="yearTabs">
    <button class="year-btn active" data-year="1"><i class="fas fa-graduation-cap"></i> Primer año</button>
    <button class="year-btn" data-year="2"><i class="fas fa-graduation-cap"></i> Segundo año</button>
    <button class="year-btn" data-year="3"><i class="fas fa-graduation-cap"></i> Tercer año</button>
  </div>

  <!-- Subjects Grid -->
  <div class="subjects-grid" id="subjectsGrid">
    <div class="subject-card" data-subject="programacion">
      <div class="subject-header">
        <div class="icon-wrapper"><i class="fas fa-code"></i></div>
        <h2>Programación</h2>
      </div>
      <div class="module-grid" id="modulosProgramacion"></div>
    </div>
    <div class="subject-card" data-subject="plm">
      <div class="subject-header">
        <div class="icon-wrapper"><i class="fas fa-pencil-ruler"></i></div>
        <h2>PLM</h2>
      </div>
      <div class="module-grid" id="modulosPlm"></div>
    </div>
  </div>

  <!-- Weeks Panel -->
  <div class="weeks-panel" id="weeksPanel">
    <div class="panel-header">
      <h3><i class="fas fa-list-ul"></i> <span id="panelTitle">Semanas · Módulo 1</span></h3>
      <span class="week-indicator" id="weekIndicator"><i class="far fa-calendar-alt"></i> Semana 1</span>
    </div>
    <div class="weeks-grid" id="weeksGrid"></div>
    <div class="files-section" id="filesSection">
      <div class="files-title"><i class="fas fa-file-code"></i> Archivos disponibles (click para abrir)</div>
      <div class="files-grid" id="filesGrid"></div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer-note">
    <i class="fas fa-arrow-right"></i> Haz clic en módulo y semana para explorar <i class="fas fa-arrow-left"></i>
  </div>
</div>

<script>
  (function() {
    // ========== DATA STRUCTURE ==========
    const DATA = {
      1: {
        programacion: { modulos: 4, semanasPorModulo: [8, 8, 8, 8], diasPorSemana: 4 },
        plm: { modulos: 4, semanasPorModulo: [8, 8, 8, 8], diasPorSemana: 1 }
      },
      2: {
        programacion: { modulos: 4, semanasPorModulo: [8, 8, 8, 8], diasPorSemana: 4 },
        plm: { modulos: 4, semanasPorModulo: [8, 8, 8, 8], diasPorSemana: 1 }
      },
      3: {
        programacion: { modulos: 4, semanasPorModulo: [8, 8, 8, 8], diasPorSemana: 4 },
        plm: { modulos: 4, semanasPorModulo: [8, 8, 8, 8], diasPorSemana: 1 }
      }
    };

    const YEAR_NAMES = { 1: 'Primer año', 2: 'Segundo año', 3: 'Tercer año' };
    const MODULE_NAMES = { 1: 'Primer modulo', 2: 'Segundo modulo', 3: 'Tercer modulo', 4: 'Cuarto modulo' };

    let currentYear = 1;
    let currentSubject = 'programacion';
    let currentModule = 1;
    let currentWeek = 1;

    const yearTabs = document.getElementById('yearTabs');
    const modulosProg = document.getElementById('modulosProgramacion');
    const modulosPlm = document.getElementById('modulosPlm');
    const weeksGrid = document.getElementById('weeksGrid');
    const filesGrid = document.getElementById('filesGrid');
    const panelTitle = document.getElementById('panelTitle');
    const weekIndicator = document.getElementById('weekIndicator');

    // ========== BUILD FILE PATH ==========
    function buildFilePath(year, subject, moduleNum, weekNum, dayNum = null) {
      const yearName = YEAR_NAMES[year];
      const subjectName = subject === 'programacion' ? 'Programacion' : 'PLM';
      const moduleName = MODULE_NAMES[moduleNum];
      const semanaNombre = `Semana ${weekNum}`;
      let fileName;
      if (subject === 'programacion') {
        fileName = `m${moduleNum}s${weekNum}d${dayNum}.html`;
      } else {
        fileName = `m${moduleNum}s${weekNum}.html`;
      }
      return `./${yearName}/${subjectName}/${moduleName}/${semanaNombre}/${fileName}`;
    }

    // ========== RENDER MODULES ==========
    function renderModules(subject, container) {
      const yearData = DATA[currentYear];
      if (!yearData) return;
      const subjectData = yearData[subject];
      if (!subjectData) return;
      const numModulos = subjectData.modulos;

      container.innerHTML = '';
      for (let m = 1; m <= numModulos; m++) {
        const btn = document.createElement('button');
        btn.className = `module-btn ${m === currentModule && subject === currentSubject ? 'active-module' : ''}`;
        btn.innerHTML = `<i class="fas fa-cube"></i> Módulo ${m}`;
        btn.dataset.module = m;
        btn.dataset.subject = subject;
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          currentModule = parseInt(btn.dataset.module);
          currentSubject = subject;
          currentWeek = 1;
          updateAll();
        });
        container.appendChild(btn);
      }
    }

    // ========== RENDER WEEKS ==========
    function renderWeeks() {
      const yearData = DATA[currentYear];
      if (!yearData) return;
      const subjectData = yearData[currentSubject];
      if (!subjectData) return;
      const semanas = subjectData.semanasPorModulo[currentModule - 1] || 8;

      weeksGrid.innerHTML = '';
      for (let w = 1; w <= semanas; w++) {
        const weekBtn = document.createElement('span');
        weekBtn.className = `week-item ${w === currentWeek ? 'active-week' : ''}`;
        weekBtn.innerHTML = `<i class="far fa-calendar-alt"></i> Semana ${w}`;
        weekBtn.dataset.week = w;
        weekBtn.addEventListener('click', () => {
          currentWeek = w;
          updateAll();
        });
        weeksGrid.appendChild(weekBtn);
      }

      weekIndicator.innerHTML = `<i class="far fa-calendar-alt"></i> Semana ${currentWeek}`;
      panelTitle.textContent = `Semanas · Módulo ${currentModule}`;
    }

    // ========== RENDER FILES ==========
    function renderFiles() {
      const yearData = DATA[currentYear];
      if (!yearData) {
        filesGrid.innerHTML = `<span class="file-empty">No hay datos para este año</span>`;
        return;
      }
      const subjectData = yearData[currentSubject];
      if (!subjectData) {
        filesGrid.innerHTML = `<span class="file-empty">Materia sin datos</span>`;
        return;
      }

      const diasPorSemana = subjectData.diasPorSemana;
      filesGrid.innerHTML = '';

      if (diasPorSemana === 1) {
        const fileName = `m${currentModule}s${currentWeek}.html`;
        const filePath = buildFilePath(currentYear, currentSubject, currentModule, currentWeek);
        const link = document.createElement('a');
        link.className = 'file-link';
        link.innerHTML = `<i class="fas fa-file-alt"></i> ${fileName}`;
        link.href = filePath;
        link.target = '_blank';
        link.title = `Abrir ${filePath}`;
        filesGrid.appendChild(link);
      } else {
        for (let d = 1; d <= 4; d++) {
          const fileName = `m${currentModule}s${currentWeek}d${d}.html`;
          const filePath = buildFilePath(currentYear, currentSubject, currentModule, currentWeek, d);
          const link = document.createElement('a');
          link.className = 'file-link';
          link.innerHTML = `<i class="fas fa-file-code"></i> Día ${d}`;
          link.href = filePath;
          link.target = '_blank';
          link.title = `Abrir ${filePath}`;
          filesGrid.appendChild(link);
        }
      }
    }

    // ========== UPDATE ALL ==========
    function updateAll() {
      renderModules('programacion', modulosProg);
      renderModules('plm', modulosPlm);

      document.querySelectorAll('.module-btn').forEach(btn => {
        const subject = btn.dataset.subject;
        const module = parseInt(btn.dataset.module);
        if (subject === currentSubject && module === currentModule) {
          btn.classList.add('active-module');
        } else {
          btn.classList.remove('active-module');
        }
      });

      renderWeeks();
      renderFiles();
    }

    // ========== SET YEAR ==========
    function setYear(year) {
      currentYear = year;
      currentModule = 1;
      currentWeek = 1;
      document.querySelectorAll('.year-btn').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.year) === year);
      });
      currentSubject = 'programacion';
      updateAll();
    }

    // ========== INIT ==========
    function init() {
      setYear(1);
      document.querySelectorAll('.year-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          setYear(parseInt(btn.dataset.year));
        });
      });
    }

    init();
  })();
</script>
</body>
</html>
